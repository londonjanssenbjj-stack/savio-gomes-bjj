                        cardBg: '#16161A',
                        cardBorder: '#26262B',

                    </div>
                    <p class="text-xs text-gray-400 leading-relaxed">Registro com até 6 graus, dados obrigatórios e biometria facial obrigatória no final.</p>
                </button>

                <!-- 2. Perfil do Aluno -->

                    <p class="text-xs text-gray-400 leading-relaxed">Fotos de biometria e chamada rápida integrada com a aba de graduação.</p>
                </button>

                    <div class="flex items-center gap-3 mb-2">
                        <span class="p-2.5 rounded-lg bg-accentNeon/10 text-accentNeon text-lg group-hover:bg-accentNeon group-hover:text-black transition-colors">🛍️</span>

                        <h4 class="font-bold text-white group-hover:text-purple-400 transition-colors">Financeiro</h4>
                    </div>
                    <p class="text-xs text-gray-400 leading-relaxed">Caixa, Pix automatizado, inadimplência e relatório de fechamento.</p>

                <button onclick="fecharModal()" class="text-gray-400 hover:text-white text-2xl font-bold px-2 py-0.5">&times;</button>
            </div>
            <div id="modalConteudo" class="text-sm text-gray-300 mb-6 space-y-4">
                <!-- Conteúdo Dinâmico -->
            </div>
            <div class="flex justify-end gap-3 border-t border-cardBorder pt-4">
                <button onclick="fecharModal()" class="px-4 py-2 bg-cardBorder hover:bg-gray-700 text-white rounded-xl text-xs font-semibold transition-colors">Fechar</button>

                            <div>
                                <label class="block text-xs font-semibold text-gray-300 mb-1">Nome do Comprador</label>
                                <input type="text" id="lojaComprador" placeholder="Nome do aluno" class="w-full bg-cardBg border border-cardBorder rounded-xl px-3 py-2 text-white text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-300 mb-1">Valor (R$)</label>
                                <input type="text" id="lojaValor" placeholder="R$ 0,00" class="w-full bg-cardBg border border-cardBorder rounded-xl px-3 py-2 text-white text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-300 mb-1">Status Pagamento</label>
                                <select id="lojaPagamento" class="w-full bg-cardBg border border-cardBorder rounded-xl px-3 py-2 text-white text-sm">
                                    <option value="Pago">Pago</option>
                                    <option value="Não Pago">Não Pago</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-300 mb-1">Status Entrega</label>
                                <select id="lojaEntrega" class="w-full bg-cardBg border border-cardBorder rounded-xl px-3 py-2 text-white text-sm">
                                    <option value="Produto Entregue">Produto Entregue</option>
                                    <option value="Produto Não Entregue">Produto Não Entregue</option>
                                </select>
                            </div>
                            <div class="sm:col-span-2 pt-2">
                                <button type="button" onclick="adicionarVendaLoja()" class="w-full bg-accentCyan text-black hover:bg-cyan-400 py-2 rounded-xl text-xs font-bold transition-all">Registar Venda na Loja</button>
                            </div>
                        </div>

                        <div class="space-y-2">
                            <h5 class="text-xs font-bold text-white">Lista de Compradores e Status:</h5>
                            <div class="space-y-2 max-h-60 overflow-y-auto">
                                ${vendasLoja.map(v => {
                                    let corBg = v.pago === 'Pago' ? 'bg-green-950/30 border-green-900/50' : 'bg-red-950/30 border-red-900/50';
                                    let textoPago = v.pago === 'Pago' ? '🟢 Pago' : '🔴 Não Pago';
                                    let textoEntrega = v.entregue === 'Produto Entregue' ? '🟢 Entregue' : '🟠 Não Entregue';
                                    return `
                                        <div class="flex justify-between items-center ${corBg} border p-3 rounded-xl text-xs">
                                            <div>
                                                <p class="font-bold text-white">${v.comprador} — ${v.produto} (${v.tamanho})</p>
                                                <p class="text-[11px] text-gray-300">Valor: ${v.valor}</p>
                                            </div>
                                            <div class="text-right space-x-2">
                                                <span class="px-2 py-1 rounded font-bold">${textoPago}</span>
                                                <span class="px-2 py-1 rounded font-bold text-amber-400">${textoEntrega}</span>
                                            </div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    </div>
                `;
            } else if (nome === 'Financeiro') {
                html = `
                    <div class="space-y-4">
                        <p class="text-xs text-gray-400">Módulo completo de caixa, cobranças blindadas e relatórios:</p>
                        <div class="grid grid-cols-2 gap-3">
                            <button onclick="alert('Código Pix Copia e Cola gerado com sucesso!')" class="bg-accentCyan/10 border border-accentCyan/30 text-accentCyan hover:bg-accentCyan/20 py-2 rounded-xl text-xs font-bold transition-all">⚡ Gerar Pix Automatizado</button>
                            <button onclick="alert('Alerta de cobrança enviado via WhatsApp com sucesso!')" class="bg-accentNeon/10 border border-accentNeon/30 text-accentNeon hover:bg-accentNeon/20 py-2 rounded-xl text-xs font-bold transition-all">💬 Cobrança WhatsApp</button>
                        </div>
                        <div class="space-y-2">
                            <h5 class="text-xs font-bold text-white">Lista de Alunos e Inadimplência:</h5>
                            <div class="space-y-1.5 text-xs">
                                <div class="flex justify-between items-center bg-red-950/30 border border-red-900/50 p-2.5 rounded-lg">
                                    <span class="text-red-400 font-semibold">🔴 Carlos Silva (Débito: 2 meses em atraso)</span>
                                    <button onclick="alert('Pagamento confirmado! Aluno removido da lista de débitos.')" class="bg-red-600 text-white px-2.5 py-1 rounded text-[10px] font-bold">Dar Baixa / Pagar</button>
                                </div>
                                <div class="flex justify-between items-center bg-green-950/30 border border-green-900/50 p-2.5 rounded-lg">
                                    <span class="text-green-400 font-semibold">🟢 Mariana Santos (Adimplente)</span>
                                    <span class="text-gray-400">Pago</span>
                                </div>
                                <div class="flex justify-between items-center bg-green-950/30 border border-green-900/50 p-2.5 rounded-lg">
                                    <span class="text-green-400 font-semibold">🟢 Bolsista: João Pedro (Isento)</span>
                                    <span class="text-gray-400">Bolsista</span>
                                </div>
                            </div>
                        </div>
                        <div class="border-t border-cardBorder pt-3 space-y-2">
                            <h5 class="text-xs font-bold text-white">Relatório de Fechamento Personalizado:</h5>
                            <div class="grid grid-cols-2 gap-2">
                                <input type="date" class="bg-darkBg border border-cardBorder rounded-lg px-2 py-1.5 text-white text-xs">
                                <input type="date" class="bg-darkBg border border-cardBorder rounded-lg px-2 py-1.5 text-white text-xs">
                            </div>
                            <button onclick="alert('Balanço gerado com sucesso! Entradas, Custos e Resultado Líquido calculados.')" class="w-full bg-purple-600 hover:bg-purple-500 text-white py-2 rounded-xl text-xs font-bold transition-all">📊 Gerar Fechamento de Caixa</button>
                        </div>
                    </div>
                `;
            }

            document.getElementById('modalConteudo').innerHTML = html;
            document.getElementById('modalModulo').classList.remove('hidden');
        }

        let biometriaConfirmada = false;

        function capturarBiometria() {
            biometriaConfirmada = true;
            document.getElementById('statusBiometria').innerHTML = "Status: ✅ Biometria Facial Capturada com Sucesso no Dispositivo!";
            document.getElementById('statusBiometria').className = "text-[11px] text-accentNeon font-bold";
            alert("Biometria Facial capturada com sucesso pela câmara do telemóvel/tablet!");
        }

        function salvarCadastroSistema() {
            let nomeInput = document.getElementById('cadNome');
            if (nomeInput) {
                if (!biometriaConfirmada) {
                    alert("Atenção: O cadastro só pode ser finalizado após a captura obrigatória da Biometria Facial!");
                    return;
                }
                let novoAluno = {
                    nome: nomeInput.value,
                    nascimento: document.getElementById('cadNasc').value,
                    whatsapp: document.getElementById('cadWpp').value,
                    endereco: document.getElementById('cadEnd').value,
                    inicio: document.getElementById('cadInicio').value,
                    faixa: document.getElementById('cadFaixa').value,
                    grau: document.getElementById('cadGrau').value,
                    frequencia: '1 aula',
                    foto: '🥋',
                    statusPagamento: 'Adimplente',
                    mesesAtraso: 0
                };
                alunosCadastrados.push(novoAluno);
                alert("Aluno cadastrado com sucesso! Integrado automaticamente nas abas Perfil, Graduação e Presença.");
                fecharModal();
            } else {
                alert("Operação efetuada com sucesso!");
                fecharModal();
            }
        }

        function darPresenca(index) {
            let btn = document.getElementById(`btnPresenca_${index}`);
            btn.innerText = 'Presença Confirmada!';
            btn.className = 'bg-green-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold';
            alert(`Presença de ${alunosCadastrados[index].nome} confirmada e alimentada automaticamente na aba Graduação!`);
        }

        function filtrarPerfis() {
            let termo = document.getElementById('inputPesquisaPerfil').value.toLowerCase();
            let container = document.getElementById('listaPerfisContainer');
            let filtrados = alunosCadastrados.filter(a => a.nome.toLowerCase().includes(termo));
            container.innerHTML = filtrados.map(a => `
                <div class="bg-darkBg p-4 rounded-xl border border-cardBorder flex items-center gap-4">
                    <div class="w-14 h-14 rounded-full bg-cardBorder flex items-center justify-center text-2xl flex-shrink-0">${a.foto}</div>
                    <div class="flex-grow">
                        <h4 class="font-bold text-white text-base">${a.nome}</h4>
                        <p class="text-xs text-accentCyan">${a.faixa} • ${a.grau}</p>
                        <p class="text-xs text-gray-400">Início: ${a.inicio} | WhatsApp: ${a.whatsapp}</p>
                        <p class="text-xs text-accentNeon">Presenças Computadas: ${a.frequencia}</p>
                    </div>
                </div>
            `).join('');
        }

        function adicionarVendaLoja() {
            let prod = document.getElementById('lojaProduto').value;
            let tam = document.getElementById('lojaTam').value || 'Único';
            let comp = document.getElementById('lojaComprador').value;
            let val = document.getElementById('lojaValor').value;
            let pag = document.getElementById('lojaPagamento').value;
            let ent = document.getElementById('lojaEntrega').value;

            if (!comp) {
                alert("Por favor, insira o nome do aluno comprador.");
                return;
            }

            vendasLoja.push({ produto: prod, tamanho: tam, comprador: comp, valor: val || 'R$ 0,00', pago: pag, entregue: ent });
            alert("Venda registada com sucesso na Loja SM!");
            abrirModulo('Loja SM');
        }

        function fecharModal() {
            document.getElementById('modalModulo').classList.add('hidden');
            biometriaConfirmada = false;
        }
    </script>
</body>
</html>
