<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo: Financeiro - Sávio Gomes BJJ</title>
    <style>
        :root {
            --bg-dark: #121212;
            --modal-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --text-muted: #aaaaaa;
            --accent-green: #2ecc71;
            --accent-red: #e74c3c;
            --accent-blue: #3498db;
            --border-color: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .modal-container {
            background-color: var(--modal-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 750px;
            max-width: 100%;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            color: var(--accent-blue);
            margin: 0;
            font-size: 20px;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 20px;
            cursor: pointer;
        }

        .section-desc {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 15px;
        }

        /* Configuração da Chave PIX */
        .pix-config-box {
            background: #252525;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .pix-config-box label {
            font-size: 13px;
            font-weight: bold;
            color: var(--text-main);
            white-space: nowrap;
        }

        .pix-config-box input {
            flex: 1;
            background: #111;
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 5px;
            color: #fff;
            font-size: 13px;
        }

        .btn-action {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            transition: opacity 0.2s;
        }

        .btn-action:hover {
            opacity: 0.9;
        }

        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .list-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
            color: var(--text-muted);
        }

        /* Lista de Alunos Pendentes */
        .student-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 250px;
            overflow-y: auto;
            margin-bottom: 20px;
            padding-right: 5px;
        }

        .student-card {
            background-color: #2a2a2a;
            border-left: 5px solid var(--accent-red);
            padding: 12px 15px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .student-info div:first-child {
            font-weight: bold;
            font-size: 14px;
        }

        .student-info div:last-child {
            font-size: 12px;
            color: var(--accent-red);
            margin-top: 3px;
        }

        .student-actions {
            display: flex;
            gap: 8px;
        }

        .btn-pay {
            background-color: var(--accent-red);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }

        .btn-pay:hover {
            background-color: #c0392b;
        }

        .btn-whatsapp {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .btn-whatsapp:hover {
            background-color: #219653;
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 20px;
            font-style: italic;
            background: #252525;
            border-radius: 6px;
        }

        /* Rodapé do Modal */
        .modal-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn-primary {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="modal-container">
    <div class="modal-header">
        <h2>Painel Administrativo: Financeiro</h2>
        <button class="close-btn">&times;</button>
    </div>

    <div class="section-desc">Módulo completo de caixa, cobranças blindadas e relatórios baseados no perfil dos alunos:</div>

    <!-- Configuração da Chave PIX do Administrador -->
    <div class="pix-config-box">
        <label for="adminPix">Chave PIX Admin:</label>
        <input type="text" id="adminPix" placeholder="Ex: 67999887766 ou email@dominio.com" value="12.345.678/0001-99">
        <button class="btn-action" onclick="salvarPix()">Salvar Chave</button>
    </div>

    <div class="list-title">Alunos com Pagamento Pendente (Calculado via Perfil):</div>
    
    <!-- Lista Dinâmica de Inadimplentes -->
    <div id="studentListContainer" class="student-list">
        <!-- Os itens serão injetados via JavaScript -->
    </div>

    <div class="modal-footer">
        <button class="btn-secondary">Fechar</button>
        <button class="btn-primary">Salvar Registros</button>
    </div>
</div>

<script>
    // Simulação de dados vindos da Aba Perfil e Cadastro de Início de Treino
    let alunosFinanceiro = [
        { id: 1, nome: "Carlos Silva", telefone: "5567999991111", dataInicio: "2026-08-20", status: "Pendente" },
        { id: 2, nome: "Mariana Santos", telefone: "5567999992222", dataInicio: "2026-09-10", status: "Pago" },
        { id: 3, nome: "Roberto Mendes", telefone: "5567999993333", dataInicio: "2026-07-15", status: "Pendente" }
    ];

    function calcularVencimento(dataInicioStr) {
        let dataInicio = new Date(dataInicioStr + 'T00:00:00');
        let mes = dataInicio.getMonth();
        let ano = dataInicio.getFullYear();
        
        // Descobre quantos dias tem o mês do ciclo atual (30 ou 31 dias)
        let diasNoMes = new Date(ano, mes + 1, 0).getDate();
        
        let vencimento = new Date(dataInicio);
        vencimento.setDate(vencimento.getDate() + diasNoMes);
        
        return vencimento;
    }

    function renderizarLista() {
        const container = document.getElementById('studentListContainer');
        container.innerHTML = '';

        // Filtra para aparecer SOMENTE o aluno pendente de pagamento
        let pendentes = alunosFinanceiro.filter(a => a.status === "Pendente");

        if (pendentes.length === 0) {
            container.innerHTML = '<div class="empty-state">Nenhum aluno com pagamento pendente no momento. Parabéns!</div>';
            return;
        }

        pendentes.forEach(aluno => {
            let vencimento = calcularVencimento(aluno.dataInicio);
            let vencimentoFormatado = vencimento.toLocaleDateString('pt-BR');
            let chavePix = document.getElementById('adminPix').value;

            // Texto customizado para cobrança via WhatsApp
            let mensagemWhats = encodeURIComponent(`Olá ${aluno.nome}, tudo bem? Passando para lembrar sobre a mensalidade do Jiu-Jitsu com vencimento em ${vencimentoFormatado}. Segue a chave PIX para pagamento: ${chavePix}. Favor enviar o comprovante após realizar.`);
            let linkWhats = `https://wa.me/${aluno.telefone}?text=${mensagemWhats}`;

            let card = document.createElement('div');
            card.className = 'student-card';
            card.innerHTML = `
                <div class="student-info">
                    <div>${aluno.nome}</div>
                    <div>Pendente (Vencimento: ${vencimentoFormatado})</div>
                </div>
                <div class="student-actions">
                    <a href="${linkWhats}" target="_blank" class="btn-whatsapp">💬 Cobrar WhatsApp</a>
                    <button class="btn-pay" onclick="darBaixa(${aluno.id})">Marcar como Pago</button>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function darBaixa(id) {
        let aluno = alunosFinanceiro.find(a => a.id === id);
        if (aluno) {
            aluno.status = "Pago"; // Ao clicar, muda o status e sai da lista de débitos
            renderizarLista();
        }
    }

    function salvarPix() {
        let chave = document.getElementById('adminPix').value;
        alert("Chave PIX salva com sucesso: " + chave);
        renderizarLista();
    }

    // Inicializa a listagem ao carregar
    window.onload = function() {
        renderizarLista();
    };
</script>

</body>
</html>
