                    <div class="flex items-center gap-3 mb-2">
                        <span class="p-2.5 rounded-lg bg-accentNeon/10 text-accentNeon text-lg group-hover:bg-accentNeon group-hover:text-black transition-colors">🛍️</span>

            </div>

                <!-- Conteúdo Dinâmico -->

                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-300 mb-1">Status Entrega</label>
                                <select id="lojaEntrega" class="w-full bg-cardBg border border-cardBorder rounded-xl px-3 py-2 text-white text-sm">
                                    <option value="Produto Entregue">Produto Entregue</option>
                                    <option value="Produto Não Entregue">Produto Não Entregue</option>
                                </select>
                            </div>
                            <div class="sm:col-span-2 pt-2">
                                <button type="button" onclick="adicionarVendaLoja()" class="w-full bg-accentCyan text-black hover:bg-cyan-400 py-2 rounded-xl text-xs font-bold transition-all">Registar Venda na Loja SG</button>
                            </div>
                        </div>

                        <div class="space-y-2">
                            <h5 class="text-xs font-bold text-white">Lista de Compradores e Status:</h5>
                            <div class="space-y-2 max-h-60 overflow-y-auto">
                                ${vendasLoja.map(v => {
                                    let corBg = v.pago === 'Pago' ? 'bg-green-950/30 border-green-900/50' : 'bg-red-950/30 border-red-900/50';
                                    let textoPago = v.pago === 'Pago' ? '🟢 Pago' : '🔴 Não Pago';
                                    let textoEntrega = v.entregue === 'Produto Entregue' ? '🟢 Entregue' : '🟠 Não Entregue';
                                    return `
                                        <div class="flex justify-between items-center ${corBg} border p-3 rounded-xl text-xs">
                                            <div>
                                                <p class="font-bold text-white">${v.comprador} — ${v.produto} (${v.tamanho})</p>
                                                <p class="text-[11px] text-gray-300">Valor: ${v.valor}</p>
                                            </div>
                                            <div class="text-right space-x-2">
                                                <span class="px-2 py-1 rounded font-bold">${textoPago}</span>
                                                <span class="px-2 py-1 rounded font-bold text-amber-400">${textoEntrega}</span>
                                            </div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    </div>
                `;
            } else if (nome === 'Financeiro') {
                html = `
                    <div class="space-y-4">
                        <p class="text-xs text-gray-400">Módulo completo de caixa, cobranças blindadas e relatórios:</p>
                        
                        <!-- Chave PIX Admin -->
                        <div class="bg-darkBg p-3 rounded-xl border border-cardBorder flex gap-2 items-center">
                            <label class="text-xs font-bold text-white whitespace-nowrap">Chave PIX Admin:</label>
                            <input type="text" id="adminPix" value="${adminPixChave}" class="w-full bg-cardBg border border-cardBorder rounded-lg px-3 py-1.5 text-white text-xs">
                            <button onclick="salvarPix()" class="bg-accentCyan text-black px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-cyan-400 transition-colors">Salvar</button>
                        </div>

                        <div class="space-y-2">
                            <h5 class="text-xs font-bold text-white">Alunos com Pagamento Pendente (Inadimplência):</h5>
                            <div id="studentListContainer" class="space-y-2 max-h-60 overflow-y-auto">
                                <!-- Renderizado Dinamicamente -->
                            </div>
                        </div>

                        <div class="border-t border-cardBorder pt-3 space-y-2">
                            <h5 class="text-xs font-bold text-white">Relatório de Fechamento Personalizado:</h5>
                            <div class="grid grid-cols-2 gap-2">
                                <input type="date" id="dataInicioRelatorio" class="bg-darkBg border border-cardBorder rounded-lg px-2 py-1.5 text-white text-xs">
                                <input type="date" id="dataFimRelatorio" class="bg-darkBg border border-cardBorder rounded-lg px-2 py-1.5 text-white text-xs">
                            </div>
                            <button onclick="gerarRelatorio()" class="w-full bg-purple-600 hover:bg-purple-500 text-white py-2 rounded-xl text-xs font-bold transition-all">📊 Gerar Fechamento de Caixa</button>
                        </div>
                    </div>
                `;
            }

            document.getElementById('modalConteudo').innerHTML = html;
            document.getElementById('modalModulo').classList.remove('hidden');

            if (nome === 'Financeiro') {
                renderizarListaFinanceiro();
            }
        }

        let biometriaConfirmada = false;

        function capturarBiometria() {
            biometriaConfirmada = true;
            document.getElementById('statusBiometria').innerHTML = "Status: ✅ Biometria Facial Capturada com Sucesso no Dispositivo!";
            document.getElementById('statusBiometria').className = "text-[11px] text-accentNeon font-bold";
            alert("Biometria Facial capturada com sucesso pela câmara do telemóvel/tablet!");
        }

        function salvarCadastroSistema() {
            let nomeInput = document.getElementById('cadNome');
            if (nomeInput) {
                if (!biometriaConfirmada) {
                    alert("Atenção: O cadastro só pode ser finalizado após a captura obrigatória da Biometria Facial!");
                    return;
                }
                let dataInicioStr = document.getElementById('cadInicio').value;
                let novoAluno = {
                    id: Date.now(),
                    nome: nomeInput.value,
                    nascimento: document.getElementById('cadNasc').value,
                    whatsapp: document.getElementById('cadWpp').value,
                    telefone: document.getElementById('cadWpp').value,
                    endereco: document.getElementById('cadEnd').value,
                    inicio: dataInicioStr,
                    dataInicio: dataInicioStr,
                    faixa: document.getElementById('cadFaixa').value,
                    grau: document.getElementById('cadGrau').value,
                    frequencia: '1 aula',
                    foto: '🥋',
                    status: 'Pendente',
                    statusPagamento: 'Inadimplente',
                    excluido: false
                };
                alunosCadastrados.push(novoAluno);
                alert("Aluno cadastrado com sucesso! Integrado automaticamente nas abas Perfil, Graduação e Presença.");
                fecharModal();
            } else {
                alert("Operação efetuada com sucesso!");
                fecharModal();
            }
        }

        function renderizarListaPerfis(lista) {
            return lista.map(a => `
                <div class="bg-darkBg p-4 rounded-xl border ${a.excluido ? 'border-red-900/50 bg-red-950/10' : 'border-cardBorder'} flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                    <div class="flex items-center gap-4">
                        <div class="w-14 h-14 rounded-full bg-cardBorder flex items-center justify-center text-2xl flex-shrink-0">${a.foto}</div>
                        <div>
                            <div class="flex items-center gap-2">
                                <h4 class="font-bold text-white text-base">${a.nome}</h4>
                                ${a.excluido ? '<span class="px-2 py-0.5 rounded text-[10px] bg-red-900/50 text-red-300 border border-red-700/50 font-bold">CADASTRO EXCLUÍDO</span>' : ''}
                            </div>
                            <p class="text-xs text-accentCyan">${a.faixa} • ${a.grau}</p>
                            <p class="text-xs text-gray-400">Início: ${a.inicio} | WhatsApp: ${a.whatsapp}</p>
                            <p class="text-xs text-accentNeon">Presenças Computadas: ${a.frequencia}</p>
                        </div>
                    </div>
                    <div>
                        ${!a.excluido ? `
                            <button onclick="excluirCadastroAluno(${a.id})" class="bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white border border-red-500/50 px-3 py-1.5 rounded-xl text-xs font-bold transition-all">
                                🗑️ Excluir Cadastro
                            </button>
                        ` : `
                            <span class="text-xs text-gray-500 italic">Registro Inativo</span>
                        `}
                    </div>
                </div>
            `).join('');
        }

        function excluirCadastroAluno(id) {
            if (confirm("Tem certeza que deseja excluir o cadastro deste aluno? O registo será mantido nas outras abas com a sinalização de cadastro excluído.")) {
                let aluno = alunosCadastrados.find(a => a.id === id);
                if (aluno) {
                    aluno.excluido = true;
                    alert("Cadastro excluído com sucesso. O nome continuará visível nas outras abas sinalizado como cadastro excluído.");
                    let input = document.getElementById('inputPesquisaPerfil');
                    if (input) {
                        filtrarPerfis();
                    }
                }
            }
        }

        function darPresenca(index) {
            if (alunosCadastrados[index].excluido) {
                alert("Atenção: Este aluno possui o cadastro excluído e não pode registrar novas presenças.");
                return;
            }
            let btn = document.getElementById(`btnPresenca_${index}`);
            btn.innerText = 'Presença Confirmada!';
            btn.className = 'bg-green-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold';
            alert(`Presença de ${alunosCadastrados[index].nome} confirmada e alimentada automaticamente na aba Graduação!`);
        }

        function filtrarPerfis() {
            let termo = document.getElementById('inputPesquisaPerfil').value.toLowerCase();
            let container = document.getElementById('listaPerfisContainer');
            let filtrados = alunosCadastrados.filter(a => a.nome.toLowerCase().includes(termo));
            container.innerHTML = renderizarListaPerfis(filtrados);
        }

        function adicionarVendaLoja() {
            let prod = document.getElementById('lojaProduto').value;
            let tam = document.getElementById('lojaTam').value || 'Único';
            let comp = document.getElementById('lojaComprador').value;
            let val = document.getElementById('lojaValor').value;
            let pag = document.getElementById('lojaPagamento').value;
            let ent = document.getElementById('lojaEntrega').value;

            if (!comp) {
                alert("Por favor, insira o nome do aluno comprador.");
                return;
            }

            vendasLoja.push({ produto: prod, tamanho: tam, comprador: comp, valor: val || 'R$ 0,00', pago: pag, entregue: ent });
            alert("Venda registada com sucesso na Loja SG!");
            abrirModulo('Loja SG');
        }

        function calcularVencimento(dataInicioStr) {
            let dataInicio = new Date(dataInicioStr + 'T00:00:00');
            let mes = dataInicio.getMonth();
            let ano = dataInicio.getFullYear();
            let diasNoMes = new Date(ano, mes + 1, 0).getDate();
            let vencimento = new Date(dataInicio);
            vencimento.setDate(vencimento.getDate() + diasNoMes);
            return vencimento;
        }

        function renderizarListaFinanceiro() {
            const container = document.getElementById('studentListContainer');
            if (!container) return;
            container.innerHTML = '';

            let pendentes = alunosCadastrados.filter(a => a.status === "Pendente" && !a.excluido);

            if (pendentes.length === 0) {
                container.innerHTML = '<div class="bg-darkBg p-3 rounded-xl border border-cardBorder text-center text-xs text-gray-400 italic">Nenhum aluno com pagamento pendente no momento. Todos estão adimplentes!</div>';
                return;
            }

            pendentes.forEach(aluno => {
                let vencimento = calcularVencimento(aluno.dataInicio);
                let vencimentoFormatado = vencimento.toLocaleDateString('pt-BR');
                let textoMensagem = encodeURIComponent(`Olá ${aluno.nome}, passamos para informar o seu débito pendente referente à mensalidade (Vencimento: ${vencimentoFormatado}). Para regularizar, realize o pagamento via PIX utilizando a chave: ${adminPixChave}. Envie o comprovante por aqui.`);
                let linkWhatsapp = `https://wa.me/${aluno.telefone}?text=${textoMensagem}`;

                let card = document.createElement('div');
                card.className = 'flex justify-between items-center bg-red-950/30 border border-red-900/50 p-3 rounded-xl text-xs';
                card.innerHTML = `
                    <div>
                        <p class="font-bold text-red-400">🔴 ${aluno.nome} (Vencimento: ${vencimentoFormatado})</p>
                        <p class="text-[10px] text-gray-400">Débito pendente de mensalidade</p>
                    </div>
                    <div class="flex gap-2">
                        <a href="${linkWhatsapp}" target="_blank" class="bg-green-600 hover:bg-green-500 text-white px-2.5 py-1 rounded-lg font-bold flex items-center gap-1 transition-colors">💬 Cobrar</a>
                        <button onclick="darBaixa(${aluno.id})" class="bg-red-600 hover:bg-red-500 text-white px-2.5 py-1 rounded-lg font-bold transition-colors">Dar Baixa</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function darBaixa(id) {
            let aluno = alunosCadastrados.find(a => a.id === id);
            if (aluno) {
                aluno.status = "Pago";
                aluno.statusPagamento = "Adimplente";
                alert(`Pagamento de ${aluno.nome} confirmado! Aluno removido da lista de débitos.`);
                renderizarListaFinanceiro();
            }
        }

        function salvarPix() {
            let inputPix = document.getElementById('adminPix');
            if (inputPix) {
                adminPixChave = inputPix.value;
                alert("Chave PIX atualizada com sucesso: " + adminPixChave);
                renderizarListaFinanceiro();
            }
        }

        function gerarRelatorio() {
            let inicio = document.getElementById('dataInicioRelatorio').value;
            let fim = document.getElementById('dataFimRelatorio').value;
            if(!inicio || !fim) {
                alert("Por favor, selecione as datas de início e fim do relatório.");
                return;
            }
            alert(`Gerando relatório de fechamento de caixa de ${inicio} até ${fim}... Balanço, Entradas e Custos calculados.`);
        }

        function fecharModal() {
            document.getElementById('modalModulo').classList.add('hidden');
            biometriaConfirmada = false;
        }
    </script>
</body>
</html>
