<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sávio Gomes - Sistema de Gestão BJJ & MMA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        darkBg: '#0A0A0C',
                        cardBg: '#16161A',
                        cardBorder: '#26262B',
                        accentCyan: '#00F0FF',
                        accentNeon: '#39FF14',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkBg text-gray-100 font-sans antialiased min-h-screen flex flex-col selection:bg-accentCyan selection:text-black">
    
    <!-- Header -->
    <header class="bg-cardBg border-b border-cardBorder sticky top-0 z-50 backdrop-blur-md bg-opacity-95 shadow-2xl">
        <div class="container mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-4">
                <div class="relative w-14 h-14 rounded-full p-0.5 bg-gradient-to-tr from-accentCyan to-accentNeon shadow-lg shadow-cyan-500/20 flex-shrink-0">
                    <!-- Nome exato do arquivo conforme o seu repositório GitHub -->
                    <img src="LOGO-SAVIO-GOMES-JPEG.jpeg" alt="Logo Sávio Gomes" onerror="this.onerror=null; this.src='logo.jpeg';" class="w-full h-full rounded-full object-cover">
                </div>
                <div>
                    <h1 class="text-xl font-extrabold tracking-wider text-white">SÁVIO GOMES</h1>
                    <p class="text-xs text-accentCyan font-medium tracking-wide">Jiu-Jitsu & MMA • Coach Since 2000</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-accentCyan/10 text-accentCyan border border-accentCyan/30 shadow-inner">
                    <span class="w-2 h-2 rounded-full bg-accentNeon mr-2 animate-pulse"></span> Sistema Online
                </span>
                <!-- Botão de Login do Administrador -->
                <button onclick="abrirLogin()" class="text-xs bg-red-600 hover:bg-red-500 text-white px-4 py-2 rounded-xl border border-red-500 font-bold transition-all shadow-lg shadow-red-600/30 flex items-center gap-2">
                    <span>🔐</span> Acesso Admin
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8 flex-grow">
        <!-- Cards de Visão Geral -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
            <div class="bg-cardBg border border-cardBorder p-6 rounded-2xl shadow-xl hover:border-accentCyan/50 transition-all duration-300 relative overflow-hidden group">
                <div class="absolute top-0 left-0 w-1 h-full bg-accentCyan"></div>
                <h3 class="text-gray-400 text-xs font-semibold uppercase tracking-wider mb-2">Alunos Ativos</h3>
                <p class="text-3xl font-black text-white group-hover:text-accentCyan transition-colors">48</p>
            </div>
            <div class="bg-cardBg border border-cardBorder p-6 rounded-2xl shadow-xl hover:border-accentNeon/50 transition-all duration-300 relative overflow-hidden group">
                <div class="absolute top-0 left-0 w-1 h-full bg-accentNeon"></div>
                <h3 class="text-gray-400 text-xs font-semibold uppercase tracking-wider mb-2">Presenças Hoje</h3>
                <p class="text-3xl font-black text-white group-hover:text-accentNeon transition-colors">32</p>
            </div>
            <div class="bg-cardBg border border-cardBorder p-6 rounded-2xl shadow-xl hover:border-amber-500/50 transition-all duration-300 relative overflow-hidden group">
                <div class="absolute top-0 left-0 w-1 h-full bg-amber-500"></div>
                <h3 class="text-gray-400 text-xs font-semibold uppercase tracking-wider mb-2">Graduações Próximas</h3>
                <p class="text-3xl font-black text-white group-hover:text-amber-400 transition-colors">5</p>
            </div>
            <div class="bg-cardBg border border-cardBorder p-6 rounded-2xl shadow-xl hover:border-purple-500/50 transition-all duration-300 relative overflow-hidden group">
                <div class="absolute top-0 left-0 w-1 h-full bg-purple-500"></div>
                <h3 class="text-gray-400 text-xs font-semibold uppercase tracking-wider mb-2">Balanço Financeiro</h3>
                <p class="text-3xl font-black text-white group-hover:text-purple-400 transition-colors">R$ 4.850</p>
            </div>
        </div>

        <!-- Módulos do Sistema -->
        <div class="bg-cardBg border border-cardBorder rounded-2xl shadow-2xl p-6 md:p-8">
            <div class="flex justify-between items-center mb-6 border-b border-cardBorder pb-4">
                <h2 class="text-lg font-bold text-white tracking-wide">Módulos do Sistema</h2>
                <span class="text-xs text-cyan-400 bg-cyan-950/40 px-3 py-1 rounded-full border border-cyan-800/50">Clique em qualquer módulo para lançamentos</span>
            </div>
            
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-5">
                <button onclick="abrirModulo('Cadastro de Alunos')" class="w-full text-left bg-darkBg border border-cardBorder p-5 rounded-xl hover:border-accentCyan cursor-pointer transition-all duration-300 hover:scale-[1.02] shadow-md group">
                    <div class="flex items-center gap-3 mb-2">
                        <span class="p-2.5 rounded-lg bg-accentCyan/10 text-accentCyan text-lg group-hover:bg-accentCyan group-hover:text-black transition-colors">📝</span>
                        <h4 class="font-bold text-white group-hover:text-accentCyan transition-colors">Cadastro de Alunos</h4>
                    </div>
                    <p class="text-xs text-gray-400 leading-relaxed">Registro de novos praticantes e dados.</p>
                </button>

                <button onclick="abrirModulo('Perfil do Aluno')" class="w-full text-left bg-darkBg border border-cardBorder p-5 rounded-xl hover:border-accentCyan cursor-pointer transition-all duration-300 hover:scale-[1.02] shadow-md group">
                    <div class="flex items-center gap-3 mb-2">
                        <span class="p-2.5 rounded-lg bg-accentCyan/10 text-accentCyan text-lg group-hover:bg-accentCyan group-hover:text-black transition-colors">👤</span>
                        <h4 class="font-bold text-white group-hover:text-accentCyan transition-colors">Perfil do Aluno</h4>
                    </div>
                    <p class="text-xs text-gray-400 leading-relaxed">Histórico de presenças, faixas e graus.</p>
                </button>

                <button onclick="abrirModulo('Graduação')" class="w-full text-left bg-darkBg border border-cardBorder p-5 rounded-xl hover:border-accentCyan cursor-pointer transition-all duration-300 hover:scale-[1.02] shadow-md group">
                    <div class="flex items-center gap-3 mb-2">
                        <span class="p-2.5 rounded-lg bg-accentCyan/10 text-accentCyan text-lg group-hover:bg-accentCyan group-hover:text-black transition-colors">📊</span>
                        <h4 class="font-bold text-white group-hover:text-accentCyan transition-colors">Graduação</h4>
                    </div>
                    <p class="text-xs text-gray-400 leading-relaxed">Acompanhamento de evolução técnica.</p>
                </button>

                <button onclick="abrirModulo('Controle de Presença')" class="w-full text-left bg-darkBg border border-cardBorder p-5 rounded-xl hover:border-accentNeon cursor-pointer transition-all duration-300 hover:scale-[1.02] shadow-md group">
                    <div class="flex items-center gap-3 mb-2">
                        <span class="p-2.5 rounded-lg bg-accentNeon/10 text-accentNeon text-lg group-hover:bg-accentNeon group-hover:text-black transition-colors">✅</span>
                        <h4 class="font-bold text-white group-hover:text-accentNeon transition-colors">Controle de Presença</h4>
                    </div>
                    <p class="text-xs text-gray-400 leading-relaxed">Chamada rápida diária.</p>
                </button>

                <button onclick="abrirModulo('Loja SM')" class="w-full text-left bg-darkBg border border-cardBorder p-5 rounded-xl hover:border-accentNeon cursor-pointer transition-all duration-300 hover:scale-[1.02] shadow-md group">
                    <div class="flex items-center gap-3 mb-2">
                        <span class="p-2.5 rounded-lg bg-accentNeon/10 text-accentNeon text-lg group-hover:bg-accentNeon group-hover:text-black transition-colors">🛍️</span>
                        <h4 class="font-bold text-white group-hover:text-accentNeon transition-colors">Loja SM</h4>
                    </div>
                    <p class="text-xs text-gray-400 leading-relaxed">Controle de kimonos, rash guards e artigos.</p>
                </button>

                <button onclick="abrirModulo('Financeiro')" class="w-full text-left bg-darkBg border border-cardBorder p-5 rounded-xl hover:border-purple-500 cursor-pointer transition-all duration-300 hover:scale-[1.02] shadow-md group">
                    <div class="flex items-center gap-3 mb-2">
                        <span class="p-2.5 rounded-lg bg-purple-500/10 text-purple-400 text-lg group-hover:bg-purple-500 group-hover:text-white transition-colors">💲</span>
                        <h4 class="font-bold text-white group-hover:text-purple-400 transition-colors">Financeiro</h4>
                    </div>
                    <p class="text-xs text-gray-400 leading-relaxed">Entradas, custos e controle de inadimplência.</p>
                </button>
            </div>
        </div>
    </main>

    <!-- Modal Dinâmico de Lançamentos e Acessos -->
    <div id="modalModulo" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden z-50 flex items-center justify-center p-4">
        <div class="bg-cardBg border border-cardBorder rounded-2xl w-full max-w-lg p-6 shadow-2xl relative">
            <div class="flex justify-between items-center mb-4 border-b border-cardBorder pb-3">
                <h3 id="modalTitulo" class="text-lg font-bold text-accentCyan">Painel</h3>
                <button onclick="fecharModal()" class="text-gray-400 hover:text-white text-2xl font-bold px-2 py-0.5">&times;</button>
            </div>
            <div id="modalConteudo" class="text-sm text-gray-300 mb-6 space-y-4">
                <!-- Conteúdo injetado dinamicamente -->
            </div>
            <div class="flex justify-end gap-3">
                <button onclick="fecharModal()" class="px-4 py-2 bg-cardBorder hover:bg-gray-700 text-white rounded-xl text-xs font-semibold transition-colors">Cancelar</button>
                <button onclick="alert('Dados lançados e guardados com sucesso!'); fecharModal();" class="px-4 py-2 bg-accentCyan text-black hover:bg-cyan-400 rounded-xl text-xs font-bold transition-colors shadow-lg shadow-cyan-500/20">Salvar Registos</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-cardBg border-t border-cardBorder py-6 text-center text-xs text-gray-500">
        <p>Sávio Gomes Jiu-Jitsu & MMA - Todos os direitos reservados[cite: 8].</p>
    </footer>

    <script>
        function abrirLogin() {
            document.getElementById('modalTitulo').innerText = "Painel de Acesso do Administrador";
            document.getElementById('modalConteudo').innerHTML = `
                <div class="space-y-3">
                    <p class="text-xs text-gray-400">Insira as suas credenciais de coach/administrador para entrar:</p>
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1">E-mail ou Utilizador:</label>
                        <input type="text" placeholder="ex: saviogomes@bjj.com" class="w-full bg-darkBg border border-cardBorder rounded-xl px-3 py-2 text-white text-sm focus:outline-none focus:border-red-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1">Palavra-passe:</label>
                        <input type="password" placeholder="••••••••" class="w-full bg-darkBg border border-cardBorder rounded-xl px-3 py-2 text-white text-sm focus:outline-none focus:border-red-500">
                    </div>
                </div>
            `;
            document.getElementById('modalModulo').classList.remove('hidden');
        }

        function abrirModulo(nome) {
            document.getElementById('modalTitulo').innerText = `Gestão / Lançamento: ${nome}`;
            document.getElementById('modalConteudo').innerHTML = `
                <div class="space-y-3">
                    <p class="text-xs text-gray-400">Insira os dados e informações para registo no sistema:</p>
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1">Nome do Aluno / Item / Descrição:</label>
                        <input type="text" placeholder="Digite o nome completo..." class="w-full bg-darkBg border border-cardBorder rounded-xl px-3 py-2 text-white text-sm focus:outline-none focus:border-accentCyan">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-gray-300 mb-1">Categoria / Graduação:</label>
                            <input type="text" placeholder="Ex: Faixa Preta / Adulto" class="w-full bg-darkBg border border-cardBorder rounded-xl px-3 py-2 text-white text-sm focus:outline-none focus:border-accentCyan">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-300 mb-1">Valor / Status:</label>
                            <input type="text" placeholder="Ex: R$ 150,00 / Ativo" class="w-full bg-darkBg border border-cardBorder rounded-xl px-3 py-2 text-white text-sm focus:outline-none focus:border-accentCyan">
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('modalModulo').classList.remove('hidden');
        }

        function fecharModal() {
            document.getElementById('modalModulo').classList.add('hidden');
        }
    </script>
</body>
</html>
