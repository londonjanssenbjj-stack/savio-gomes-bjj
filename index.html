<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestão - Sávio Gomes BJJ</title>
    <style>
        :root {
            --bg-dark: #121212;
            --modal-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --text-muted: #aaaaaa;
            --accent-green: #2ecc71;
            --accent-red: #e74c3c;
            --accent-blue: #3498db;
            --border-color: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Barra de Navegação de Abas */
        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            background-color: #252525;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background-color: var(--accent-blue);
            color: white;
            border-color: var(--accent-blue);
        }

        /* Container Principal / Modais */
        .modal-container {
            background-color: var(--modal-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 750px;
            max-width: 100%;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            display: none;
        }

        .modal-container.active {
            display: block;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            color: var(--accent-blue);
            margin: 0;
            font-size: 20px;
        }

        .section-desc {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 15px;
        }

        /* Aba Perfil: Estilos */
        .profile-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-size: 13px;
            font-weight: bold;
            color: var(--text-muted);
        }

        .form-group input {
            background: #111;
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
        }

        /* Aba Financeiro: Configuração da Chave PIX */
        .pix-config-box {
            background: #252525;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .pix-config-box label {
            font-size: 13px;
            font-weight: bold;
            color: var(--text-main);
            white-space: nowrap;
        }

        .pix-config-box input {
            flex: 1;
            background: #111;
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 5px;
            color: #fff;
            font-size: 13px;
        }

        .btn-action {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            transition: opacity 0.2s;
        }

        .btn-action:hover {
            opacity: 0.9;
        }

        .list-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
            color: var(--text-muted);
        }

        /* Lista de Alunos Pendentes (Inadimplência) */
        .student-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 250px;
            overflow-y: auto;
            margin-bottom: 20px;
            padding-right: 5px;
        }

        .student-card {
            background-color: #2a2a2a;
            border-left: 5px solid var(--accent-red);
            padding: 12px 15px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .student-info div:first-child {
            font-weight: bold;
            font-size: 14px;
        }

        .student-info div:last-child {
            font-size: 12px;
            color: var(--accent-red);
            margin-top: 3px;
        }

        .student-actions {
            display: flex;
            gap: 8px;
        }

        .btn-pay {
            background-color: var(--accent-red);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-pay:hover {
            background-color: #c0392b;
        }

        .btn-whatsapp {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: background 0.2s;
        }

        .btn-whatsapp:hover {
            background-color: #219653;
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 20px;
            font-style: italic;
            background: #252525;
            border-radius: 6px;
        }

        /* Relatório de Fechamento */
        .report-section {
            background: #252525;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .report-section label {
            font-size: 13px;
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: var(--text-muted);
        }

        .date-inputs {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .date-inputs input {
            flex: 1;
            background: #111;
            border: 1px solid var(--border-color);
            padding: 8px;
            border-radius: 5px;
            color: #fff;
            font-size: 13px;
        }

        .btn-full {
            width: 100%;
            background-color: #8e44ad;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-full:hover {
            background-color: #732d91;
        }

        /* Rodapé do Modal */
        .modal-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn-primary {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Navegação de Abas do Sistema -->
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="trocarAba('perfil')">Aba Perfil</button>
        <button class="tab-btn" onclick="trocarAba('financeiro')">Painel Financeiro</button>
    </div>

    <!-- ================= ABA PERFIL ================= -->
    <div id="aba-perfil" class="modal-container active">
        <div class="modal-header">
            <h2>Perfil do Aluno</h2>
        </div>
        <div class="section-desc">Dados cadastrais e histórico de início dos treinos do aluno:</div>
        
        <div class="profile-form">
            <div class="form-group">
                <label>Nome Completo:</label>
                <input type="text" id="perfilNome" value="Carlos Silva">
            </div>
            <div class="form-group">
                <label>Telefone / WhatsApp (com DDI e DDD):</label>
                <input type="text" id="perfilTelefone" value="5567999991111">
            </div>
            <div class="form-group">
                <label>Data de Início dos Treinos:</label>
                <input type="date" id="perfilDataInicio" value="2026-08-20">
            </div>
        </div>

        <div class="modal-footer" style="margin-top: 20px;">
            <button class="btn-secondary">Cancelar</button>
            <button class="btn-primary" onclick="salvarPerfil()">Salvar Perfil</button>
        </div>
    </div>

    <!-- ================= ABA FINANCEIRO ================= -->
    <div id="aba-financeiro" class="modal-container">
        <div class="modal-header">
            <h2>Painel Administrativo: Financeiro</h2>
        </div>

        <div class="section-desc">Módulo completo de caixa, cobranças blindadas e relatórios:</div>

        <!-- Campo de Configuração da Chave PIX do Administrador -->
        <div class="pix-config-box">
            <label for="adminPix">Chave PIX Admin:</label>
            <input type="text" id="adminPix" placeholder="Informe a chave PIX para pagamento" value="contato@salaoglam.com.br">
            <button class="btn-action" onclick="salvarPix()">Salvar Chave</button>
        </div>

        <div class="list-title">Alunos com Pagamento Pendente (Inadimplência):</div>
        
        <!-- Lista de Alunos Pendentes (Sincronizada com Perfil e calculada por vencimento) -->
        <div id="studentListContainer" class="student-list">
            <!-- Renderizado dinamicamente via Script -->
        </div>

        <!-- Seção de Relatório de Fechamento -->
        <div class="report-section">
            <label>Relatório de Fechamento Personalizado:</label>
            <div class="date-inputs">
                <input type="date" id="dataInicioRelatorio">
                <input type="date" id="dataFimRelatorio">
            </div>
            <button class="btn-full" onclick="gerarRelatorio()">Gerar Fechamento de Caixa</button>
        </div>

        <div class="modal-footer">
            <button class="btn-secondary">Fechar</button>
            <button class="btn-primary">Salvar Registros</button>
        </div>
    </div>

<script>
    // Banco de dados centralizado simulando os registros integrados
    let dadosAlunos = [
        { 
            id: 1, 
            nome: "Carlos Silva", 
            telefone: "5567999991111", 
            dataInicio: "2026-08-20", 
            status: "Pendente" 
        },
        { 
            id: 2, 
            nome: "Mariana Santos", 
            telefone: "5567999992222", 
            dataInicio: "2026-09-10", 
            status: "Pago" 
        },
        { 
            id: 3, 
            nome: "Roberto Mendes", 
            telefone: "5567999993333", 
            dataInicio: "2026-07-15", 
            status: "Pendente" 
        }
    ];

    // Função de navegação entre as abas
    function trocarAba(aba) {
        document.querySelectorAll('.modal-container').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

        if (aba === 'perfil') {
            document.getElementById('aba-perfil').classList.add('active');
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
        } else if (aba === 'financeiro') {
            document.getElementById('aba-financeiro').classList.add('active');
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            renderizarListaFinanceiro();
        }
    }

    // Salva as alterações feitas na aba Perfil para refletir no financeiro
    function salvarPerfil() {
        let nome = document.getElementById('perfilNome').value;
        let telefone = document.getElementById('perfilTelefone').value;
        let dataInicio = document.getElementById('perfilDataInicio').value;

        // Atualiza o primeiro aluno como exemplo de vínculo direto
        if(dadosAlunos.length > 0) {
            dadosAlunos[0].nome = nome;
            dadosAlunos[0].telefone = telefone;
            dadosAlunos[0].dataInicio = dataInicio;
        }

        alert("Alterações do perfil salvas com sucesso!");
        trocarAba('financeiro');
    }

    // Calcula data de início + 30 ou 31 dias do mês correspondente
    function calcularVencimento(dataInicioStr) {
        let dataInicio = new Date(dataInicioStr + 'T00:00:00');
        let mes = dataInicio.getMonth();
        let ano = dataInicio.getFullYear();
        
        let diasNoMes = new Date(ano, mes + 1, 0).getDate(); // 30 ou 31 dias
        
        let vencimento = new Date(dataInicio);
        vencimento.setDate(vencimento.getDate() + diasNoMes);
        
        return vencimento;
    }

    // Renderiza SOMENTE os alunos pendentes na aba financeiro
    function renderizarListaFinanceiro() {
        const container = document.getElementById('studentListContainer');
        container.innerHTML = '';

        // Filtra para exibir apenas quem está com status 'Pendente'
        let pendentes = dadosAlunos.filter(a => a.status === "Pendente");

        if (pendentes.length === 0) {
            container.innerHTML = '<div class="empty-state">Nenhum aluno com pagamento pendente no momento. Todos estão adimplentes!</div>';
            return;
        }

        pendentes.forEach(aluno => {
            let vencimento = calcularVencimento(aluno.dataInicio);
            let vencimentoFormatado = vencimento.toLocaleDateString('pt-BR');
            let chavePixAdmin = document.getElementById('adminPix').value;

            // Mensagem automática de cobrança por WhatsApp contendo débito e chave PIX cadastrada
            let textoMensagem = encodeURIComponent(`Olá ${aluno.nome}, passamos para informar o seu débito pendente referente à mensalidade (Vencimento: ${vencimentoFormatado}). Para regularizar, realize o pagamento via PIX utilizando a chave: ${chavePixAdmin}. Envie o comprovante por aqui.`);
            let linkWhatsapp = `https://wa.me/${aluno.telefone}?text=${textoMensagem}`;

            let card = document.createElement('div');
            card.className = 'student-card';
            card.innerHTML = `
                <div class="student-info">
                    <div>${aluno.nome}</div>
                    <div>Pendente (Vencimento: ${vencimentoFormatado})</div>
                </div>
                <div class="student-actions">
                    <a href="${linkWhatsapp}" target="_blank" class="btn-whatsapp">💬 Cobrar WhatsApp</a>
                    <button class="btn-pay" onclick="darBaixa(${aluno.id})">Pago</button>
                </div>
            `;
            container.appendChild(card);
        });
    }

    // Dá baixa no pagamento: muda o status para "Pago" e remove o aluno da lista de pendentes em débitos
    function darBaixa(id) {
        let aluno = dadosAlunos.find(a => a.id === id);
        if (aluno) {
            aluno.status = "Pago";
            renderizarListaFinanceiro();
        }
    }

    function salvarPix() {
        let chave = document.getElementById('adminPix').value;
        alert("Chave PIX atualizada com sucesso: " + chave);
        renderizarListaFinanceiro();
    }

    function gerarRelatorio() {
        let inicio = document.getElementById('dataInicioRelatorio').value;
        let fim = document.getElementById('dataFimRelatorio').value;
        if(!inicio || !fim) {
            alert("Por favor, selecione as datas de início e fim do relatório.");
            return;
        }
        alert(`Gerando relatório de fechamento de caixa de ${inicio} até ${fim}...`);
    }

    // Inicialização ao carregar a página
    window.onload = function() {
        renderizarListaFinanceiro();
    };
</script>

</body>
</html>
